owner: MrcRjs # Your GitHub organization or username, where this repository lives
repo: status-losfuertechs # The name of this repository

sites:
  - name: Plexi
    slug: plex
    url: $PLEX_BASE
    expectedStatusCodes:
      - 200
      - 401
  - name: Sirius
    url: $SIRIUS_BASE

status-website:
